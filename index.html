<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panchang Calendar</title>
<meta name="description" content="Panchang Calendar by Nivriti Rajput: daily Hindu panchang (tithi, nakshatra, yoga, karana), sunrise, moonrise, Rahu Kaal, choghadiya, hora, festivals and vrats for Indian cities, in English and Hindi.">
<meta name="theme-color" content="#e8590c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7ef; --card:#ffffff; --cell:#fffcf8; --soft:#fff0e2;
    --ink:#3a2314; --muted:#8c6a55; --line:#f3dfcb;
    --accent:#e8590c; --accent-d:#b8430a; --accent-2:#ffb347; --gold:#d99a00; --gold-l:#fff4d6;
    --glow1:#ffe3c4; --glow2:#ffe6ef;
    --green:#2f9e5b; --green-l:#e5f6eb; --red:#d9534f; --red-l:#fde8e7; --blue:#3a7bd5; --blue-l:#e7f0fd; --purple:#7c4dff; --purple-l:#efe9ff;
    --night:#2b2350; --shadow:0 8px 24px rgba(160,80,20,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15100c; --card:#221a14; --cell:#2a2019; --soft:#33271d;
      --ink:#f7eadc; --muted:#c4a68f; --line:#443528;
      --accent:#ff8c42; --accent-d:#ffb070; --accent-2:#ffcf8a; --gold:#f0c040; --gold-l:#3a3018;
      --glow1:#2a1c10; --glow2:#2a1520;
      --green:#5cc98a; --green-l:#1d3627; --red:#ff7b76; --red-l:#3d2222; --blue:#7fb0ff; --blue-l:#1c2738; --purple:#b49cff; --purple-l:#2a2347;
      --night:#0c0a1c; --shadow:0 8px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15100c; --card:#221a14; --cell:#2a2019; --soft:#33271d;
    --ink:#f7eadc; --muted:#c4a68f; --line:#443528;
    --accent:#ff8c42; --accent-d:#ffb070; --accent-2:#ffcf8a; --gold:#f0c040; --gold-l:#3a3018;
    --glow1:#2a1c10; --glow2:#2a1520;
    --green:#5cc98a; --green-l:#1d3627; --red:#ff7b76; --red-l:#3d2222; --blue:#7fb0ff; --blue-l:#1c2738; --purple:#b49cff; --purple-l:#2a2347;
    --night:#0c0a1c; --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Nunito','Baloo 2',system-ui,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(circle at 8% 0%,var(--glow1) 0,transparent 40%),radial-gradient(circle at 100% 25%,var(--glow2) 0,transparent 35%),var(--bg);transition:background-color .3s,color .3s}
  h1,h2,h3,button,select,.bal{font-family:'Baloo 2',system-ui,sans-serif}
  .wrap{max-width:1560px;margin:0 auto;padding:0 16px 40px}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px;min-width:0}
  .card h2{font-size:1.2rem;color:var(--accent-d);line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .card h2 small{font-family:Nunito;font-size:.8rem;color:var(--muted);font-weight:700}
  .card h3{font-size:1.02rem;margin:10px 0 4px}
  .sub{color:var(--muted);font-weight:600;font-size:.88rem}
  .hidden{display:none!important}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 12px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px rgba(0,0,0,.15);animation:diya 3s ease-in-out infinite}
  @keyframes diya{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
  .brand h1{font-size:1.8rem;line-height:1;color:var(--accent-d)}
  .brand small{display:block;color:var(--muted);font-weight:700;font-size:.88rem;margin-top:3px}
  .hctl{display:flex;gap:8px;align-items:center;flex:none}
  .btn{cursor:pointer;font-weight:700;font-size:1rem;padding:7px 14px;border-radius:12px;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .15s;line-height:1.3}
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d)}
  :root[data-theme="dark"] .btn.primary{color:#1a120c}
  .btn.sm{font-size:.86rem;padding:3px 10px;border-radius:10px}
  .seg{display:inline-flex;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;font-weight:700;font-size:.96rem;padding:6px 12px;border-radius:10px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .seg button.on{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .seg button.on{color:#1a120c}
  .mainnav{display:flex;width:100%;margin-bottom:14px;background:var(--card)}
  .mainnav button{flex:1;font-size:1.02rem;padding:8px 4px}
  .options{display:none;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
  .options.open{display:flex;animation:fadeUp .25s ease both}
  .opt{display:flex;flex-direction:column;gap:5px;min-width:0}
  .lbl{font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  select,input{font:inherit;font-weight:700;font-size:.98rem;color:var(--ink);background:var(--cell);border:2px solid var(--line);border-radius:12px;padding:8px 10px;outline:none;max-width:100%}
  select:focus,input:focus{border-color:var(--accent)}

  /* dashboard layout */
  .dash{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
  .dash>*{min-width:0}
  .side{display:none}
  .cards2{display:grid;grid-template-columns:1fr;gap:0 14px;align-items:start}
  .cards2>*{min-width:0}

  /* date nav */
  .dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
  .dnav .btn{font-size:1.15rem;padding:6px 14px}
  .dnav .mid{text-align:center;line-height:1.15;min-width:0}
  .dnav .mid b{font-family:'Baloo 2';font-size:1.3rem;color:var(--accent-d);display:block}
  .dnav .mid span{font-size:.84rem;font-weight:700;color:var(--muted)}
  .dnav-tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:-4px 0 12px}
  .dnav-tools input{padding:4px 8px;font-size:.9rem}

  /* hero */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;position:relative;overflow:hidden}
  .moon{width:96px;height:96px;grid-row:span 3;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
  .hero .tname{font-family:'Baloo 2';font-size:1.6rem;line-height:1.1;color:var(--accent-d)}
  .hero .tmeta{font-weight:700;color:var(--muted);font-size:.9rem}
  .festbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .fchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.88rem;background:var(--gold-l);border:2px solid var(--gold);cursor:pointer;color:var(--ink);font-family:Nunito}
  .fchip.vrat{background:var(--purple-l);border-color:var(--purple)}
  .fchip.nat{background:var(--blue-l);border-color:var(--blue)}

  /* rows of panchang elements */
  .el{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .el:last-child{border-bottom:none}
  .el .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--soft)}
  .el small{display:block;font-size:.74rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .el b{font-family:'Baloo 2';font-size:1.06rem;line-height:1.2;display:block}
  .el em{font-style:normal;font-size:.82rem;color:var(--muted);font-weight:700;display:block}
  .el .tm{text-align:right;font-weight:800;font-size:.86rem;white-space:nowrap}
  .el .tm span{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
  .el.next{opacity:.8}
  .el.next .ic{background:transparent;border:2px dashed var(--line)}
  .good{color:var(--green)} .bad{color:var(--red)}
  .tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:999px;padding:0 8px;margin-left:4px;vertical-align:1px}
  .tag.g{background:var(--green-l);color:var(--green)} .tag.b{background:var(--red-l);color:var(--red)} .tag.n{background:var(--soft);color:var(--muted)}

  /* sun & moon */
  .sm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sm div{background:var(--cell);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
  .sm div span{display:block;font-size:1.4rem;line-height:1.2}
  .sm div b{display:block;font-size:.98rem}
  .sm div small{display:block;font-size:.72rem;color:var(--muted);font-weight:800}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.92rem}
  .kv dt{font-weight:800;color:var(--muted)}
  .kv dd{font-weight:700;min-width:0}

  /* timeline */
  .tline{position:relative;height:46px;border-radius:12px;overflow:hidden;background:var(--night);margin:8px 0 4px}
  .tline .dayp{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#ffd58a,#ffe9b8 50%,#ffd58a)}
  .tline .blk{position:absolute;top:22px;bottom:4px;border-radius:6px;font-size:.62rem;font-weight:800;color:#fff;display:grid;place-items:center;overflow:hidden;white-space:nowrap}
  .tline .blk.rahu{background:var(--red)} .tline .blk.abh{background:var(--green)} .tline .blk.yama{background:#a0522d} .tline .blk.guli{background:#6d6d6d}
  .tline .now{position:absolute;top:0;bottom:0;width:3px;background:var(--accent);box-shadow:0 0 0 2px #fff}
  .tline .hr{position:absolute;top:3px;font-size:.6rem;font-weight:800;color:rgba(255,255,255,.75);transform:translateX(-50%)}
  .tline .dayp~.hr{color:rgba(0,0,0,.45)}
  .tlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;font-weight:700;color:var(--muted)}
  .tlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

  /* muhurat list */
  .mu{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
  .mu:last-child{border-bottom:none}
  .mu b{font-weight:800}
  .mu .t{font-weight:800;white-space:nowrap}
  .mu.isnow{background:var(--soft);border-radius:10px;padding-left:8px;padding-right:8px}

  /* choghadiya & hora */
  .chg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ch{border-radius:12px;padding:6px 8px;font-size:.84rem;font-weight:700;border:2px solid transparent;display:flex;justify-content:space-between;gap:6px}
  .ch.g{background:var(--green-l)} .ch.b{background:var(--red-l)} .ch.n{background:var(--blue-l)}
  .ch.isnow{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow1)}
  .ch b{font-family:'Baloo 2';font-size:.95rem}
  .ch span{white-space:nowrap;color:var(--muted)}
  .hora{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;font-size:.82rem}
  .hora div{display:flex;justify-content:space-between;gap:6px;padding:4px 8px;border-radius:8px;background:var(--cell);font-weight:700}
  .hora div.isnow{background:var(--soft);outline:2px solid var(--accent)}

  /* month grid */
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .mhead b{font-family:'Baloo 2';font-size:1.25rem;color:var(--accent-d);text-align:center;line-height:1.1}
  .mhead b small{display:block;font-family:Nunito;font-size:.78rem;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .grid .wd{text-align:center;font-size:.76rem;font-weight:800;color:var(--muted);padding:2px 0}
  .grid .wd.sun{color:var(--red)}
  .day{position:relative;background:var(--cell);border:2px solid var(--line);border-radius:12px;min-height:92px;padding:5px 6px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:1px;overflow:hidden;transition:transform .12s}
  .day:hover{transform:translateY(-2px);border-color:var(--accent-2)}
  .day .dn{font-family:'Baloo 2';font-weight:800;font-size:1.15rem;line-height:1}
  .day.sun .dn{color:var(--red)}
  .day .ti{font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .fe{font-size:.7rem;font-weight:800;color:var(--accent-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .fe.v{color:var(--purple)}
  .day .mo{position:absolute;top:5px;right:5px;width:16px;height:16px}
  .day.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-l)}
  .day.sel{border-color:var(--accent);background:var(--soft)}
  .day.blank{visibility:hidden}
  .day .dots{display:flex;gap:2px;margin-top:auto}
  .day .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .day .dots i.v{background:var(--purple)} .day .dots i.n{background:var(--blue)}
  .mini .day{min-height:42px;padding:3px;align-items:center;justify-content:flex-start;border-radius:10px}
  .mini .day .dn{font-size:.95rem}
  .mini .day .ti,.mini .day .fe{display:none}
  .mini .day .mo{width:11px;height:11px;top:3px;right:3px}
  .mini .grid{gap:3px}

  /* festival list */
  .flist .fm{font-family:'Baloo 2';font-size:1.1rem;color:var(--accent-d);margin:14px 0 4px;border-bottom:2px solid var(--line)}
  details.fe{border-bottom:1px dashed var(--line)}
  details.fe>summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
  details.fe>summary::-webkit-details-marker{display:none}
  .fdate{text-align:center;border-radius:12px;background:var(--soft);padding:4px 0;line-height:1.05}
  .fdate b{display:block;font-family:'Baloo 2';font-size:1.3rem;color:var(--accent-d)}
  .fdate small{font-size:.7rem;font-weight:800;color:var(--muted)}
  .fname b{font-family:'Baloo 2';font-size:1.05rem;display:block;line-height:1.2}
  .fname em{font-style:normal;font-size:.8rem;color:var(--muted);font-weight:700}
  .fcount{font-size:.78rem;font-weight:800;color:var(--muted);text-align:right;white-space:nowrap}
  .fbody{padding:0 0 12px 64px;font-size:.93rem;animation:fadeUp .25s both}
  .fbody p{margin:4px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.86rem;cursor:pointer;color:var(--ink);font-family:Nunito}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .nextf{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
  .nextf .em{font-size:3rem;grid-row:span 3;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .nextf .cd{font-family:'Baloo 2';font-size:1.6rem;color:var(--accent-d);line-height:1.1}

  /* learn */
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .learn p{margin:6px 0}
  .subnav{display:flex;flex-wrap:wrap;width:100%;margin-bottom:12px}
  .subnav button{flex:1}

  .toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:12px;transition:transform .3s;z-index:30;max-width:calc(100% - 32px);text-align:center}
  .toast.show{transform:translate(-50%,0)}
  footer{text-align:center;color:var(--muted);font-size:.84rem;margin-top:22px;font-weight:600}
  .madeby{font-family:'Baloo 2';font-size:1.15rem;color:var(--accent-d);margin-top:6px;font-weight:700}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .view{animation:fadeUp .3s ease both}

  /* ---------- TABLET 700–1099 ---------- */
  @media (min-width:700px){
    .cards2{grid-template-columns:1fr 1fr}
    .cards2>.wide{grid-column:1/-1}
    .chg{grid-template-columns:1fr 1fr}
    .hora{grid-template-columns:repeat(3,1fr)}
  }
  /* ---------- LAPTOP 1100–1439: sidebar + main ---------- */
  @media (min-width:1100px){
    .dash{grid-template-columns:330px 1fr}
    .side{display:block;position:sticky;top:12px}
    .dnav-mobile{display:none}
    .aside{grid-column:2}
  }
  /* ---------- DESKTOP ≥1440: sidebar + main + timings ---------- */
  @media (min-width:1440px){
    .dash{grid-template-columns:330px 1fr 360px}
    .aside{grid-column:3;grid-row:1;position:sticky;top:12px}
    .aside .chg{grid-template-columns:1fr}
    .aside .hora{grid-template-columns:1fr 1fr}
  }
  /* ---------- PHONE <700 ---------- */
  @media (max-width:699px){
    header{padding:12px 0 10px}
    .brand small{display:none}
    .brand h1{font-size:1.45rem}
    .logo{width:42px;height:42px;font-size:22px}
    .hctl .btn{padding:6px 10px}
    .mainnav button{font-size:.92rem;padding:7px 2px}
    .card{padding:13px;border-radius:18px}
    .moon{width:78px;height:78px}
    .hero .tname{font-size:1.35rem}
    .sm{grid-template-columns:repeat(2,1fr)}
    .day{min-height:56px;padding:3px 4px;border-radius:10px}
    .day .dn{font-size:1rem}
    .day .fe{display:none}
    .day .ti{font-size:.64rem}
    .day .mo{width:12px;height:12px;top:3px;right:3px}
    .grid{gap:3px}
    .fbody{padding-left:0}
    .options .opt{width:100%}
    .chg{grid-template-columns:1fr}
  }
  @media print{
    .hctl,.mainnav,.options,.noprint,.toast,.side{display:none!important}
    body{background:#fff}
    .card{box-shadow:none;break-inside:avoid}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">🪔</div><div><h1 id="appName">Panchang</h1><small id="tagline"></small></div></div>
    <div class="hctl"><button class="btn" id="langBtn"></button><button class="btn" id="optBtn" aria-label="Options" aria-expanded="false">⚙️</button></div>
  </header>
  <section class="card options" id="options" aria-label="Options"></section>
  <nav class="seg mainnav" id="mainNav" role="tablist"></nav>
  <main id="app" aria-live="polite"></main>
  <footer><p id="disclaimer"></p><div class="madeby">Made by Nivriti Rajput 💜</div></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   Panchang engine — sun & moon positions (Meeus, low/medium precision),
   Lahiri ayanamsa, sunrise/moonrise, tithi, nakshatra, yoga, karana,
   lunar month, muhurats, choghadiya, hora, vrats.
   All times are Julian Days (UT). Angles in degrees.
   ========================================================= */
const PE = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const norm = a => ((a % 360) + 360) % 360;
  const sin = d => Math.sin(d * D2R), cos = d => Math.cos(d * D2R);

  const jdFromDate = d => d.getTime() / 86400000 + 2440587.5;
  const dateFromJd = jd => new Date((jd - 2440587.5) * 86400000);
  // civil date (y,m,d at local midnight) -> JD UT, tz in hours
  const jdLocalMidnight = (y, m, d, tz) => Date.UTC(y, m - 1, d) / 86400000 + 2440587.5 - tz / 24;
  const deltaT = jd => { const y = 2000 + (jd - 2451545) / 365.25; return (69 + 0.35 * (y - 2026)) / 86400; };

  /* ---------- nutation (main terms) ---------- */
  function nutation(T) {

const INFO={
'lohri':I('🔥',b('A Punjabi winter festival marking the end of the coldest days and the harvest of sugarcane. It is linked with the folk hero Dulla Bhatti, who helped poor girls.','पंजाब का शीतकालीन त्योहार, जो कड़ाके की ठंड के अंत और गन्ने की फ़सल का प्रतीक है। इसे लोकनायक दुल्ला भट्टी से जोड़ा जाता है, जिन्होंने ग़रीब लड़कियों की मदद की।'),b('A bonfire is lit in the evening; people throw rewri, peanuts and popcorn into it, sing and dance bhangra and giddha.','शाम को अलाव जलाया जाता है; लोग उसमें रेवड़ी, मूँगफली और पॉपकॉर्न डालते हैं, गीत गाते हैं और भांगड़ा-गिद्दा करते हैं।'),b('Rewri, gajak, til laddoo, makki di roti and sarson da saag.','रेवड़ी, गजक, तिल के लड्डू, मक्की की रोटी और सरसों का साग।')),
'makar-sankranti':I('🪁',b('The day the Sun enters Makara (Capricorn) rashi and begins its northward journey (Uttarayana). It is one of the few festivals fixed by the Sun, not the Moon.','वह दिन जब सूर्य मकर राशि में प्रवेश करता है और उत्तरायण की यात्रा शुरू करता है। यह उन कुछ त्योहारों में है जो चंद्रमा नहीं, सूर्य से तय होते हैं।'),b('Holy dips in rivers, donating sesame and jaggery, and flying kites — especially in Gujarat and Rajasthan.','नदियों में पवित्र स्नान, तिल-गुड़ का दान और पतंगबाज़ी — ख़ासकर गुजरात और राजस्थान में।'),b('Til-gud laddoo, khichdi, chikki and undhiyu.','तिल-गुड़ के लड्डू, खिचड़ी, चिक्की और उंधियू।')),
'pongal':I('🍚',b('A four-day Tamil harvest festival thanking the Sun, cattle and nature for a good crop.','चार दिन का तमिल फ़सल उत्सव, जिसमें अच्छी फ़सल के लिए सूर्य, पशुओं और प्रकृति को धन्यवाद दिया जाता है।'),b('New rice is boiled with milk and jaggery until it overflows — "Pongalo Pongal!" Homes are decorated with kolam.','नए चावल को दूध और गुड़ में तब तक उबाला जाता है जब तक वह उफन न जाए — "पोंगलो पोंगल!" घरों में कोलम बनाए जाते हैं।'),b('Sakkarai pongal, ven pongal, sugarcane.','सक्करई पोंगल, वेन पोंगल, गन्ना।')),
'vasant-panchami':I('🌼',b('Celebrates the arrival of spring and Goddess Saraswati, the goddess of knowledge, music and arts.','वसंत ऋतु के आगमन और ज्ञान, संगीत व कला की देवी सरस्वती का उत्सव।'),b('People wear yellow, worship books and instruments, and little children often write their first letters (Vidyarambh).','लोग पीले कपड़े पहनते हैं, किताबों और वाद्य यंत्रों की पूजा करते हैं, और छोटे बच्चे अक्सर पहली बार अक्षर लिखते हैं (विद्यारंभ)।'),b('Kesari (saffron) rice, boondi, yellow sweets.','केसरिया भात, बूंदी, पीली मिठाइयाँ।')),
'maha-shivaratri':I('🔱',b('The great night of Lord Shiva — remembered as the night of Shiva\'s cosmic dance and his marriage to Parvati.','भगवान शिव की महान रात्रि — शिव के तांडव और शिव-पार्वती विवाह की रात के रूप में याद की जाती है।'),b('Devotees fast, offer water, milk and bel leaves on the Shivling, and stay awake chanting "Om Namah Shivaya".','भक्त उपवास रखते हैं, शिवलिंग पर जल, दूध और बेलपत्र चढ़ाते हैं और "ॐ नमः शिवाय" जपते हुए रात भर जागते हैं।'),b('Fasting foods: sabudana khichdi, fruits, thandai.','व्रत का भोजन: साबूदाना खिचड़ी, फल, ठंडाई।')),
'holika-dahan':I('🔥',b('Remembers how young Prahlad, a devotee of Vishnu, was saved from the fire while the demoness Holika burned — good wins over evil.','विष्णु भक्त प्रह्लाद की रक्षा और होलिका के जल जाने की याद — बुराई पर अच्छाई की जीत।'),b('A bonfire is lit after sunset at the right muhurat (avoiding Bhadra); people circle it and offer new grain.','सूर्यास्त के बाद शुभ मुहूर्त (भद्रा छोड़कर) में होलिका जलाई जाती है; लोग परिक्रमा करते हैं और नया अनाज अर्पित करते हैं।'),b('Gujiya, roasted wheat and gram ears.','गुझिया, भुने गेहूँ और चने की बालियाँ।')),
'holi':I('🎨',b('The festival of colours celebrates spring, love (Radha–Krishna) and the victory of good over evil.','रंगों का त्योहार वसंत, प्रेम (राधा-कृष्ण) और बुराई पर अच्छाई की जीत का उत्सव है।'),b('People play with gulal and coloured water, visit friends, forgive old quarrels and sing Holi songs.','लोग गुलाल और रंगीन पानी से खेलते हैं, दोस्तों से मिलते हैं, पुराने गिले-शिकवे भूलते हैं और फाग गाते हैं।'),b('Gujiya, thandai, dahi bhalla, malpua.','गुझिया, ठंडाई, दही भल्ले, मालपुए।')),
'chaitra-navratri-start':I('🌸',b('Nine nights of Goddess Durga in spring; the Hindu (Vikram Samvat) new year begins on the first day.','वसंत में माँ दुर्गा की नौ रातें; पहले दिन हिंदू नववर्ष (विक्रम संवत) शुरू होता है।'),b('Ghatasthapana (pot installation) on day 1, fasting, and worship of a different form of Durga each day.','पहले दिन घटस्थापना, उपवास, और हर दिन दुर्गा के अलग रूप की पूजा।'),b('Kuttu puri, sabudana, fruit chaat, halwa-chana on Ashtami/Navami.','कुट्टू की पूरी, साबूदाना, फलाहार, अष्टमी/नवमी पर हलवा-चना।')),
'gudi-padwa-ugadi':I('🎋',b('New Year for Maharashtra (Gudi Padwa) and Karnataka, Andhra and Telangana (Ugadi), on Chaitra Shukla Pratipada.','चैत्र शुक्ल प्रतिपदा पर महाराष्ट्र (गुड़ी पड़वा) और कर्नाटक, आंध्र, तेलंगाना (उगादी) का नववर्ष।'),b('A gudi (decorated pole with cloth and a pot) is raised; rangoli is drawn; people taste a mix of six flavours for a balanced year.','गुड़ी (कपड़े और कलश से सजा डंडा) फहराई जाती है; रंगोली बनती है; पूरे साल के संतुलन के लिए छह स्वादों का मिश्रण चखा जाता है।'),b('Puran poli, Ugadi pachadi, shrikhand.','पूरन पोली, उगादी पचड़ी, श्रीखंड।')),
'ram-navami':I('🏹',b('The birthday of Lord Rama, born at noon on Chaitra Shukla Navami in Ayodhya.','भगवान राम का जन्मदिन, जो अयोध्या में चैत्र शुक्ल नवमी को दोपहर में जन्मे।'),b('Midday puja, reading the Ramayana, processions and kanya pujan to end Navratri.','दोपहर की पूजा, रामायण पाठ, शोभायात्राएँ और नवरात्रि के समापन पर कन्या पूजन।'),b('Panakam, kosambari, halwa-puri-chana.','पानकम, कोसंबरी, हलवा-पूरी-चना।')),
'mahavir-jayanti':I('🕊️',b('Birth anniversary of Bhagwan Mahavir, the 24th Jain Tirthankara, who taught non-violence and truth.','24वें जैन तीर्थंकर भगवान महावीर की जयंती, जिन्होंने अहिंसा और सत्य का उपदेश दिया।'),b('Processions with his idol, charity, and prayers in Jain temples.','उनकी प्रतिमा की शोभायात्रा, दान और जैन मंदिरों में प्रार्थना।'),null),
'hanuman-jayanti':I('🐒',b('Birthday of Lord Hanuman, the mighty devotee of Rama, celebrated on Chaitra Purnima in North India.','राम के परम भक्त हनुमान जी का जन्मोत्सव, उत्तर भारत में चैत्र पूर्णिमा को।'),b('Reciting Hanuman Chalisa and Sundar Kand, offering sindoor and boondi at temples.','हनुमान चालीसा और सुंदरकांड का पाठ, मंदिरों में सिंदूर और बूंदी चढ़ाना।'),b('Boondi laddoo, besan laddoo.','बूंदी के लड्डू, बेसन के लड्डू।')),
'baisakhi':I('🌾',b('Punjab\'s harvest festival and the day Guru Gobind Singh founded the Khalsa in 1699.','पंजाब का फ़सल उत्सव और वह दिन जब 1699 में गुरु गोबिंद सिंह जी ने ख़ालसा पंथ की स्थापना की।'),b('Gurdwara visits, nagar kirtan, fairs, bhangra and giddha.','गुरुद्वारे जाना, नगर कीर्तन, मेले, भांगड़ा और गिद्दा।'),b('Kada prasad, meethe chawal, chole bhature.','कड़ा प्रसाद, मीठे चावल, छोले भटूरे।')),
'akshaya-tritiya':I('💰',b('"Akshaya" means never-ending: good deeds and purchases on this day are believed to bring lasting blessings. Parashurama was born on this day.','"अक्षय" यानी कभी न ख़त्म होने वाला: इस दिन किए गए शुभ काम और ख़रीदारी स्थायी फल देते हैं। इसी दिन परशुराम का जन्म हुआ।'),b('Buying gold, starting new ventures, charity of water pots and fans, worship of Vishnu and Lakshmi.','सोना ख़रीदना, नए काम शुरू करना, जल से भरे घड़े और पंखे दान करना, विष्णु-लक्ष्मी पूजा।'),null),
'parashurama-jayanti':I('🪓',b('Birthday of Parashurama, the sixth avatar of Vishnu, known for his axe and devotion to his father.','विष्णु के छठे अवतार परशुराम का जन्मदिन, जो अपने फरसे और पितृभक्ति के लिए प्रसिद्ध हैं।'),b('Prayers and processions, especially in Brahmin communities.','पूजा और शोभायात्राएँ।'),null),
'buddha-purnima':I('☸️',b('Marks the birth, enlightenment and passing of Gautama Buddha — all on Vaishakha Purnima.','गौतम बुद्ध के जन्म, ज्ञान-प्राप्ति और महापरिनिर्वाण का दिन — तीनों वैशाख पूर्णिमा को।'),b('Prayers at monasteries, lighting lamps, kindness to animals and charity.','मठों में प्रार्थना, दीप जलाना, जीवों पर दया और दान।'),b('Kheer (as Sujata offered the Buddha).','खीर (जैसे सुजाता ने बुद्ध को दी थी)।')),
'vat-savitri':I('🌳',b('Remembers Savitri, who by her wisdom and devotion won back her husband Satyavan\'s life from Yama.','सावित्री की याद, जिन्होंने अपनी बुद्धि और निष्ठा से यमराज से पति सत्यवान के प्राण वापस पाए।'),b('Married women fast and tie threads around a banyan (vat) tree while circling it.','विवाहित महिलाएँ व्रत रखती हैं और बरगद के पेड़ की परिक्रमा कर धागा बाँधती हैं।'),b('Soaked chana, puri, mango.','भीगे चने, पूरी, आम।')),
'shani-jayanti':I('🪐',b('Birthday of Shani Dev (Saturn), son of Surya, on Jyeshtha Amavasya.','सूर्यपुत्र शनि देव का जन्मदिन, ज्येष्ठ अमावस्या को।'),b('Offering mustard oil and black sesame at Shani temples; charity to the poor.','शनि मंदिरों में सरसों का तेल और काले तिल चढ़ाना; ग़रीबों को दान।'),null),
'adhik-maas-start':I('➕',b('An extra lunar month added roughly every 3 years so the lunar calendar stays in step with the seasons. 2026 has Adhik Jyeshtha.','चंद्र पंचांग को ऋतुओं के साथ बनाए रखने के लिए लगभग हर 3 साल में जुड़ने वाला अतिरिक्त महीना। 2026 में अधिक ज्येष्ठ है।'),b('Called Purushottam Maas; devoted to Vishnu. Weddings and new beginnings are usually avoided; prayer and charity are encouraged.','इसे पुरुषोत्तम मास कहते हैं; यह विष्णु को समर्पित है। विवाह और नए काम टाले जाते हैं; पूजा और दान को बढ़ावा।'),null),
'ganga-dussehra':I('🌊',b('Celebrates the descent of the river Ganga from heaven to earth, brought down by King Bhagiratha.','राजा भगीरथ के तप से गंगा के स्वर्ग से पृथ्वी पर अवतरण का उत्सव।'),b('Holy dips in the Ganga, Ganga aarti and donating ten items.','गंगा स्नान, गंगा आरती और दस वस्तुओं का दान।'),null),
'nirjala-ekadashi':I('💧',b('The strictest Ekadashi — fasting without even water. Bhima is said to have kept it to gain the merit of all 24 Ekadashis.','सबसे कठिन एकादशी — बिना पानी का व्रत। माना जाता है कि भीम ने सभी 24 एकादशियों का फल पाने के लिए इसे रखा।'),b('Full fast without water from sunrise to next sunrise; donating water pots and fans.','सूर्योदय से अगले सूर्योदय तक बिना पानी का व्रत; जल से भरे घड़े और पंखे दान।'),null),
'rath-yatra':I('🛕',b('Lord Jagannath, with Balabhadra and Subhadra, rides huge chariots from the Puri temple to Gundicha temple.','भगवान जगन्नाथ, बलभद्र और सुभद्रा के साथ विशाल रथों में पुरी मंदिर से गुंडिचा मंदिर जाते हैं।'),b('Thousands pull the chariots with ropes; processions happen in many cities.','हज़ारों भक्त रस्सियों से रथ खींचते हैं; कई शहरों में यात्राएँ निकलती हैं।'),b('Mahaprasad, khaja, poda pitha.','महाप्रसाद, खाजा, पोड़ा पीठा।')),
'devshayani-ekadashi':I('😴',b('Vishnu is believed to go into cosmic sleep for four months (Chaturmas) from this day.','मान्यता है कि इस दिन से भगवान विष्णु चार महीने (चातुर्मास) के लिए योगनिद्रा में जाते हैं।'),b('Fasting and Vishnu puja; the Pandharpur wari in Maharashtra ends on this day.','व्रत और विष्णु पूजा; महाराष्ट्र की पंढरपुर वारी इसी दिन पूरी होती है।'),null),
'guru-purnima':I('🙏',b('A day to honour teachers; it is also the birthday of sage Ved Vyasa, who compiled the Vedas and wrote the Mahabharata.','गुरुओं के सम्मान का दिन; यह वेदव्यास जी का जन्मदिन भी है जिन्होंने वेदों का संकलन और महाभारत की रचना की।'),b('Students thank and touch the feet of their teachers; spiritual gatherings.','शिष्य गुरुओं को धन्यवाद देते हैं और चरण स्पर्श करते हैं; सत्संग।'),null),
'hariyali-teej':I('🌿',b('A monsoon festival celebrating the reunion of Shiva and Parvati after her long penance.','मानसून का त्योहार, जो पार्वती के लंबे तप के बाद शिव-पार्वती के मिलन का उत्सव है।'),b('Women wear green, apply mehndi, swing on decorated jhoolas and sing Teej songs.','महिलाएँ हरे कपड़े पहनती हैं, मेहंदी लगाती हैं, झूला झूलती हैं और तीज के गीत गाती हैं।'),b('Ghevar, malpua, kheer.','घेवर, मालपुआ, खीर।')),
'kajari-teej':I('🌧️',b('A monsoon Teej in Bhadrapada, named after kajari folk songs of the rains.','भाद्रपद की तीज, जिसका नाम बारिश के कजरी लोकगीतों पर पड़ा।'),b('Women fast for their family\'s well-being and worship the neem tree and Goddess Parvati.','महिलाएँ परिवार की खुशहाली के लिए व्रत रखती हैं और नीम व माँ पार्वती की पूजा करती हैं।'),b('Sattu laddoo.','सत्तू के लड्डू।')),
'hartalika-teej':I('💚',b('Remembers how Parvati\'s friends took her to the forest so she could do penance to marry Shiva.','याद दिलाती है कि पार्वती की सखियाँ उन्हें वन ले गईं ताकि वे शिव से विवाह के लिए तप कर सकें।'),b('A strict fast by women, clay idols of Shiva-Parvati, and night-long prayers.','महिलाओं का कठिन व्रत, शिव-पार्वती की मिट्टी की मूर्तियाँ और रात भर पूजा।'),null),
'nag-panchami':I('🐍',b('A day to honour snakes (Nag Devta), remembering their place in nature and in stories like Krishna and Kaliya.','नाग देवता के सम्मान का दिन, प्रकृति में उनकी जगह और कृष्ण-कालिया जैसी कथाओं की याद।'),b('People draw snake images and offer milk and flowers at snake shrines; digging the soil is avoided.','लोग नाग के चित्र बनाते हैं और नाग देवता को दूध व फूल चढ़ाते हैं; ज़मीन खोदने से बचा जाता है।'),null),
'onam':I('🌺',b('Kerala\'s harvest festival welcoming the beloved King Mahabali, who visits his people every year.','केरल का फ़सल उत्सव, जिसमें प्रिय राजा महाबली का स्वागत होता है जो हर साल अपनी प्रजा से मिलने आते हैं।'),b('Pookalam flower carpets, snake-boat races, Kathakali and Thiruvathira dances.','फूलों की पूकलम, नौका दौड़, कथकली और तिरुवातिरा नृत्य।'),b('Onam sadya — a feast of 20+ dishes on a banana leaf, payasam.','ओणम सद्या — केले के पत्ते पर 20 से ज़्यादा व्यंजन, पायसम।')),
'raksha-bandhan':I('🎀',b('Celebrates the bond of brothers and sisters. Stories include Krishna and Draupadi, and Yama and Yamuna.','भाई-बहन के रिश्ते का उत्सव। कथाओं में कृष्ण-द्रौपदी और यम-यमुना शामिल हैं।'),b('Sisters tie a rakhi on their brother\'s wrist (avoiding Bhadra time); brothers promise to protect them and give gifts.','बहनें भाई की कलाई पर राखी बाँधती हैं (भद्रा काल छोड़कर); भाई रक्षा का वचन और उपहार देते हैं।'),b('Ghevar, kaju katli, coconut laddoo.','घेवर, काजू कतली, नारियल के लड्डू।')),
'janmashtami':I('🦚',b('Birthday of Lord Krishna, born at midnight in a Mathura prison on Bhadrapada Krishna Ashtami.','भगवान कृष्ण का जन्मदिन, जो भाद्रपद कृष्ण अष्टमी की आधी रात को मथुरा के कारागार में जन्मे।'),b('Fasting until midnight, jhankis, swinging baby Krishna\'s cradle and Dahi Handi the next day.','आधी रात तक व्रत, झाँकियाँ, बाल गोपाल का झूला और अगले दिन दही हांडी।'),b('Makhan-mishri, panjiri, dhaniya panjiri, panchamrit.','माखन-मिश्री, पंजीरी, धनिया पंजीरी, पंचामृत।')),
'ganesh-chaturthi':I('🐘',b('Birthday of Lord Ganesha, remover of obstacles. The ten-day public festival was popularised by Lokmanya Tilak.','विघ्नहर्ता गणेश जी का जन्मदिन। दस दिन के सार्वजनिक उत्सव को लोकमान्य तिलक ने लोकप्रिय बनाया।'),b('Ganesha idols are installed at home and in pandals, worshipped for 1–10 days and immersed in water.','घरों और पंडालों में गणेश मूर्ति स्थापित कर 1 से 10 दिन पूजा की जाती है और फिर विसर्जन होता है।'),b('Modak, laddoo, puran poli.','मोदक, लड्डू, पूरन पोली।')),
'anant-chaturdashi':I('🌊',b('The last day of Ganesh Utsav and a day to worship Vishnu in his Anant (endless) form.','गणेशोत्सव का आख़िरी दिन और विष्णु के अनंत रूप की पूजा का दिन।'),b('Ganesh visarjan processions; tying the 14-knot Anant sutra.','गणेश विसर्जन की शोभायात्राएँ; 14 गाँठों वाला अनंत सूत्र बाँधना।'),null),
'pitru-paksha-start':I('🕯️',b('A fortnight to remember and thank ancestors (pitrs).','पितरों को याद करने और धन्यवाद देने का पखवाड़ा।'),b('Shraddh and tarpan on the tithi of the ancestor\'s passing; feeding Brahmins, cows, crows and the needy.','पितर की मृत्यु तिथि पर श्राद्ध और तर्पण; ब्राह्मणों, गाय, कौवों और ज़रूरतमंदों को भोजन।'),b('Kheer, puri, simple sattvic food.','खीर, पूरी, सात्विक भोजन।')),
'sarva-pitru-amavasya':I('🪔',b('The last day of Pitru Paksha, when all ancestors are remembered together.','पितृ पक्ष का अंतिम दिन, जब सभी पितरों को एक साथ याद किया जाता है।'),b('Shraddh for all ancestors, especially those whose date is not known.','सभी पितरों का श्राद्ध, ख़ासकर जिनकी तिथि ज्ञात न हो।'),null),
'sharad-navratri-start':I('🪷',b('Nine nights of Goddess Durga, who fought the buffalo-demon Mahishasura and won on the tenth day.','माँ दुर्गा की नौ रातें, जिन्होंने महिषासुर से युद्ध कर दसवें दिन विजय पाई।'),b('Ghatasthapana, fasting, garba and dandiya in Gujarat, Durga Puja pandals in Bengal, Ramlila in North India.','घटस्थापना, उपवास, गुजरात में गरबा-डांडिया, बंगाल में दुर्गा पूजा पंडाल, उत्तर भारत में रामलीला।'),b('Kuttu, singhara, sabudana, makhana.','कुट्टू, सिंघाड़ा, साबूदाना, मखाना।')),
'durga-ashtami':I('🗡️',b('The eighth day of Navratri, dedicated to Goddess Mahagauri.','नवरात्रि का आठवाँ दिन, माँ महागौरी को समर्पित।'),b('Kanya pujan — young girls are worshipped as forms of the Goddess and fed.','कन्या पूजन — छोटी बच्चियों को देवी का रूप मानकर पूजा और भोजन कराया जाता है।'),b('Halwa, puri, black chana.','हलवा, पूरी, काले चने।')),
'maha-navami':I('🌺',b('The ninth day of Navratri, dedicated to Goddess Siddhidatri.','नवरात्रि का नौवाँ दिन, माँ सिद्धिदात्री को समर्पित।'),b('Kanya pujan, havan and Ayudha puja (worship of tools and books) in the South.','कन्या पूजन, हवन और दक्षिण में आयुध पूजा (औज़ार और किताबों की पूजा)।'),b('Halwa, puri, chana.','हलवा, पूरी, चना।')),
'dussehra':I('🏹',b('Vijayadashami — Lord Rama defeated Ravana, and Goddess Durga defeated Mahishasura. Good triumphs over evil.','विजयादशमी — भगवान राम ने रावण को और माँ दुर्गा ने महिषासुर को हराया। अच्छाई की बुराई पर जीत।'),b('Ravana effigies are burned after Ramlila; Shami puja; Durga idols are immersed.','रामलीला के बाद रावण दहन; शमी पूजन; दुर्गा प्रतिमा विसर्जन।'),b('Jalebi, fafda.','जलेबी, फाफड़ा।')),
'sharad-purnima':I('🌕',b('The full moon of Ashwin, said to be the brightest of the year; Krishna\'s Raas Leela with the gopis is remembered.','आश्विन की पूर्णिमा, जिसे साल का सबसे उजला चाँद माना जाता है; गोपियों के साथ कृष्ण की रासलीला की याद।'),b('Kheer is kept under the moonlight overnight and eaten the next morning; night-long celebrations.','खीर को रात भर चाँदनी में रखकर सुबह खाया जाता है; रात भर उत्सव।'),b('Moonlight kheer.','चाँदनी वाली खीर।')),
'karwa-chauth':I('🌙',b('A fast kept by married women for their husband\'s long life, ended after seeing the moon.','विवाहित महिलाओं का पति की लंबी उम्र के लिए व्रत, जो चाँद देखकर खोला जाता है।'),b('Sargi before sunrise, a full-day fast, evening katha with karwa pots, and moon-sighting through a sieve.','सूर्योदय से पहले सरगी, दिन भर का व्रत, शाम को करवे के साथ कथा, और छलनी से चाँद देखना।'),b('Sargi: mathri, pheni, fruits, dry fruits.','सरगी: मठरी, फेनी, फल, मेवे।')),
'ahoi-ashtami':I('⭐',b('Mothers fast for the well-being of their children and worship Ahoi Mata.','माताएँ संतान की भलाई के लिए व्रत रखती हैं और अहोई माता की पूजा करती हैं।'),b('An Ahoi Mata picture is drawn on the wall; the fast ends after seeing the stars in the evening.','दीवार पर अहोई माता का चित्र बनाया जाता है; शाम को तारे देखकर व्रत खोला जाता है।'),b('Puri, halwa, mathri.','पूरी, हलवा, मठरी।')),
'dhanteras':I('🪙',b('The first day of Diwali. Dhanvantari, the god of medicine, appeared with a pot of nectar on this day.','दिवाली का पहला दिन। इसी दिन औषधियों के देवता धन्वंतरि अमृत कलश लेकर प्रकट हुए।'),b('Buying metal utensils or gold, cleaning homes and lighting a lamp for Yama at the door.','धातु के बर्तन या सोना ख़रीदना, घर की सफ़ाई और द्वार पर यम दीपक जलाना।'),null),

const LEARN_TXT={
 what:b(`<h2>🪔 What is a Panchang?</h2><p><b>Panchang</b> (पंचांग) means "five limbs". It is the traditional Hindu calendar and almanac. Each day it describes five things:</p>
 <ol style="margin-left:20px"><li><b>Tithi</b> — the lunar day, based on the angle between the Moon and the Sun (every 12°).</li><li><b>Vara</b> — the weekday, ruled by a planet.</li><li><b>Nakshatra</b> — which of 27 star-groups the Moon is in.</li><li><b>Yoga</b> — a combination of the Sun's and Moon's positions (27 kinds).</li><li><b>Karana</b> — half of a tithi (11 kinds).</li></ol>
 <p>The Hindu <b>day starts at sunrise</b>, not midnight. So the tithi "of the day" is usually the one running at sunrise, even if it changes later.</p>
 <p>A <b>lunar month</b> has two halves: <b>Shukla Paksha</b> (waxing, new moon → full moon) and <b>Krishna Paksha</b> (waning). In North India months end on Purnima (<b>Purnimanta</b>); in the South and West they end on Amavasya (<b>Amanta</b>). The festivals fall on the same day — only the month name differs in Krishna Paksha.</p>
 <p>Because 12 lunar months are about 11 days shorter than a solar year, an <b>Adhik Maas</b> (extra month) is added about every 32½ months. 2026 has Adhik Jyeshtha.</p>
 <p><b>Eras:</b> Vikram Samvat is 57 years ahead of the Gregorian year (after Chaitra), and Shaka Samvat (India's national calendar) is 78 years behind.</p>`,
 `<h2>🪔 पंचांग क्या है?</h2><p><b>पंचांग</b> का अर्थ है "पाँच अंग"। यह पारंपरिक हिंदू कैलेंडर है। हर दिन यह पाँच बातें बताता है:</p>
 <ol style="margin-left:20px"><li><b>तिथि</b> — चंद्र दिवस, जो चंद्रमा और सूर्य के बीच के कोण (हर 12°) पर आधारित है।</li><li><b>वार</b> — सप्ताह का दिन, जिसका स्वामी एक ग्रह है।</li><li><b>नक्षत्र</b> — 27 तारा-समूहों में से वह जिसमें चंद्रमा है।</li><li><b>योग</b> — सूर्य और चंद्र की स्थिति का मेल (27 प्रकार)।</li><li><b>करण</b> — तिथि का आधा भाग (11 प्रकार)।</li></ol>
 <p>हिंदू <b>दिन सूर्योदय से शुरू</b> होता है, आधी रात से नहीं। इसलिए दिन की तिथि आमतौर पर वह होती है जो सूर्योदय के समय चल रही हो।</p>
 <p><b>चंद्र मास</b> के दो पक्ष होते हैं: <b>शुक्ल पक्ष</b> (अमावस्या से पूर्णिमा) और <b>कृष्ण पक्ष</b>। उत्तर भारत में महीने पूर्णिमा पर ख़त्म होते हैं (<b>पूर्णिमांत</b>); दक्षिण और पश्चिम में अमावस्या पर (<b>अमांत</b>)। त्योहार एक ही दिन पड़ते हैं — बस कृष्ण पक्ष में महीने का नाम बदलता है।</p>
 <p>12 चंद्र मास सौर वर्ष से लगभग 11 दिन छोटे होते हैं, इसलिए लगभग हर 32½ महीने में एक <b>अधिक मास</b> जुड़ता है। 2026 में अधिक ज्येष्ठ है।</p>
 <p><b>संवत:</b> विक्रम संवत (चैत्र के बाद) ग्रेगोरियन वर्ष से 57 साल आगे है, और शक संवत (भारत का राष्ट्रीय कैलेंडर) 78 साल पीछे।</p>`),
 tithi:b(`<h2>🌙 Tithis</h2><p>Every time the Moon moves 12° further ahead of the Sun, a new tithi begins. There are 30 tithis in a lunar month — 15 in each paksha. A tithi lasts about 19 to 26 hours, so sometimes a tithi is skipped (<b>kshaya</b>) or covers two sunrises (<b>vriddhi</b>).</p>`,
   `<h2>🌙 तिथियाँ</h2><p>जब भी चंद्रमा सूर्य से 12° और आगे बढ़ता है, एक नई तिथि शुरू होती है। एक चंद्र मास में 30 तिथियाँ होती हैं — हर पक्ष में 15। एक तिथि लगभग 19 से 26 घंटे की होती है, इसलिए कभी कोई तिथि छूट जाती है (<b>क्षय</b>) या दो सूर्योदयों तक रहती है (<b>वृद्धि</b>)।</p>`),
 nak:b(`<h2>✨ Nakshatras</h2><p>The sky along the Moon's path is divided into 27 equal parts of 13°20′, each called a nakshatra (lunar mansion). The Moon spends about one day in each. Every nakshatra has 4 padas (quarters) of 3°20′, a ruling planet (used in Vimshottari dasha) and a presiding deity.</p>`,
   `<h2>✨ नक्षत्र</h2><p>चंद्रमा के मार्ग वाले आकाश को 13°20′ के 27 बराबर भागों में बाँटा गया है, जिन्हें नक्षत्र कहते हैं। चंद्रमा हर नक्षत्र में लगभग एक दिन रहता है। हर नक्षत्र के 4 पाद (3°20′ के), एक स्वामी ग्रह (विंशोत्तरी दशा में उपयोगी) और एक देवता होते हैं।</p>`),
 yoga:b(`<h2>🧘 Yoga</h2><p>Add the sidereal longitudes of the Sun and the Moon and divide by 13°20′ — that gives one of 27 yogas. Nine are considered inauspicious for starting new work.</p>`,
   `<h2>🧘 योग</h2><p>सूर्य और चंद्रमा के निरयन भोगांश को जोड़कर 13°20′ से भाग दें — 27 में से एक योग मिलता है। नौ योग नए काम के लिए अशुभ माने जाते हैं।</p>`),
 karana:b(`<h3>🔱 Karana</h3><p>Each tithi has two karanas (6° each), so a month has 60. Seven movable karanas repeat eight times; four fixed ones appear once. <b>Vishti (Bhadra)</b> is avoided for auspicious work — for example, Rakhi and Holika Dahan are done outside Bhadra.</p>`,
   `<h3>🔱 करण</h3><p>हर तिथि में दो करण (6° के) होते हैं, इसलिए महीने में 60। सात चर करण आठ बार दोहराए जाते हैं; चार स्थिर करण एक बार आते हैं। <b>विष्टि (भद्रा)</b> में शुभ काम नहीं किए जाते — जैसे राखी और होलिका दहन भद्रा के बाहर किए जाते हैं।</p>`),
 muh:b(`<h2>⏰ Muhurat & daily timings</h2>
  <p><b>Rahu Kaal</b>: daytime (sunrise→sunset) is split into 8 parts; one part each weekday belongs to Rahu and is avoided for new beginnings (Mon 2nd, Sat 3rd, Fri 4th, Wed 5th, Thu 6th, Tue 7th, Sun 8th). <b>Yamaganda</b> and <b>Gulika</b> work the same way with different parts.</p>
  <p><b>Abhijit Muhurat</b>: the 8th of 15 daytime muhurtas, around local noon — good for most work (traditionally skipped on Wednesday).</p>
  <p><b>Brahma Muhurat</b>: the 14th muhurta of the night, about 1½ hours before sunrise — ideal for study, prayer and yoga.</p>
  <p><b>Choghadiya</b>: day and night are each split into 8 parts named Amrit, Shubh, Labh, Char (good), and Udveg, Rog, Kaal (avoid). Popular in Gujarat and Rajasthan for travel and business.</p>
  <p><b>Hora</b>: 24 planetary hours starting at sunrise with the weekday's lord, following the order Sun → Venus → Mercury → Moon → Saturn → Jupiter → Mars.</p>
  <p><b>Dishashool</b>: a direction considered unlucky for travel on each weekday.</p>`,
  `<h2>⏰ मुहूर्त और दैनिक समय</h2>
  <p><b>राहु काल</b>: दिन (सूर्योदय→सूर्यास्त) को 8 भागों में बाँटा जाता है; हर वार का एक भाग राहु का होता है जिसमें नया काम नहीं किया जाता (सोम दूसरा, शनि तीसरा, शुक्र चौथा, बुध पाँचवाँ, गुरु छठा, मंगल सातवाँ, रवि आठवाँ)। <b>यमगंड</b> और <b>गुलिक</b> भी इसी तरह अलग भागों में होते हैं।</p>
  <p><b>अभिजीत मुहूर्त</b>: दिन के 15 मुहूर्तों में 8वाँ, स्थानीय दोपहर के आसपास — ज़्यादातर कामों के लिए शुभ (परंपरा से बुधवार को नहीं)।</p>
  <p><b>ब्रह्म मुहूर्त</b>: रात का 14वाँ मुहूर्त, सूर्योदय से लगभग डेढ़ घंटा पहले — पढ़ाई, पूजा और योग के लिए आदर्श।</p>
  <p><b>चौघड़िया</b>: दिन और रात दोनों को 8-8 भागों में बाँटा जाता है — अमृत, शुभ, लाभ, चर (शुभ) और उद्वेग, रोग, काल (अशुभ)। गुजरात और राजस्थान में यात्रा और व्यापार के लिए लोकप्रिय।</p>
  <p><b>होरा</b>: सूर्योदय से वार के स्वामी से शुरू होने वाले 24 ग्रह-घंटे, क्रम सूर्य → शुक्र → बुध → चंद्र → शनि → गुरु → मंगल।</p>
  <p><b>दिशाशूल</b>: हर वार की वह दिशा जिसमें यात्रा अशुभ मानी जाती है।</p>`),
 how:b(`<h2>🔭 How this app calculates</h2><p>Everything is calculated live in your browser — no internet lookup is needed after the page loads.</p>
  <ul style="margin-left:20px"><li><b>Sun & Moon positions</b>: astronomical series from Jean Meeus' <i>Astronomical Algorithms</i> (60+ terms for the Moon), accurate to a few arc-seconds for the Sun and about 10″ for the Moon.</li>
  <li><b>Sidereal zodiac</b>: Lahiri (Chitrapaksha) ayanamsa, the official Indian standard.</li>
  <li><b>Tithi / nakshatra / yoga / karana end times</b>: found by repeatedly refining the moment the angle crosses each boundary.</li>
  <li><b>Sunrise & sunset</b>: when the Sun's upper edge touches the horizon, including atmospheric refraction. <b>Moonrise</b> uses the Moon's centre.</li>
  <li><b>Lunar months</b>: named by the Sun's rashi at the new moon that starts the month; a month with no Sun sign change is Adhik.</li>
  <li><b>Vrats</b> (Ekadashi, Pradosh, Sankashti…) are found by checking which tithi is running at the traditional time (sunrise, sunset, moonrise or midnight). Big festivals come from the Delhi panchang for 2026–2027.</li></ul>
  <p>Results were checked against a published Delhi panchang: tithi and nakshatra end times match within 1–2 minutes. Small differences of a few minutes are normal between panchangs.</p>`,
  `<h2>🔭 यह ऐप गणना कैसे करता है</h2><p>सब कुछ आपके ब्राउज़र में ही गणना होता है — पेज खुलने के बाद इंटरनेट की ज़रूरत नहीं।</p>
  <ul style="margin-left:20px"><li><b>सूर्य और चंद्र की स्थिति</b>: ज्याँ मीउस की <i>Astronomical Algorithms</i> के खगोलीय सूत्र (चंद्रमा के लिए 60 से ज़्यादा पद) — सूर्य के लिए कुछ विकला और चंद्र के लिए लगभग 10″ तक सटीक।</li>
  <li><b>निरयन राशिचक्र</b>: लाहिड़ी (चित्रापक्ष) अयनांश, भारत का आधिकारिक मानक।</li>
  <li><b>तिथि / नक्षत्र / योग / करण का समाप्ति समय</b>: कोण के हर सीमा पार करने का क्षण बार-बार सुधार कर निकाला जाता है।</li>
  <li><b>सूर्योदय और सूर्यास्त</b>: जब सूर्य का ऊपरी किनारा क्षितिज छूता है, वायुमंडलीय अपवर्तन सहित। <b>चंद्रोदय</b> चंद्रमा के केंद्र से।</li>
  <li><b>चंद्र मास</b>: महीना शुरू करने वाली अमावस्या पर सूर्य की राशि से नाम; जिस महीने में सूर्य राशि न बदले वह अधिक मास।</li>
  <li><b>व्रत</b> (एकादशी, प्रदोष, संकष्टी…) परंपरागत समय (सूर्योदय, सूर्यास्त, चंद्रोदय या मध्यरात्रि) पर चल रही तिथि देखकर निकाले जाते हैं। बड़े त्योहार 2026–2027 के दिल्ली पंचांग से लिए गए हैं।</li></ul>
  <p>परिणामों की जाँच प्रकाशित दिल्ली पंचांग से की गई: तिथि और नक्षत्र के समाप्ति समय 1–2 मिनट के भीतर मेल खाते हैं। पंचांगों में कुछ मिनट का अंतर सामान्य है।</p>`)
};

function place(){if(S.loc)return S.loc;const c=CITIES[S.city]||CITIES[0];return {name:b(c[0],c[1]),lat:c[2],lon:c[3],tz:5.5};}
const placeName=()=>L(place().name);
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
function civil(jd,tz){const t=new Date((jd-2440587.5)*86400000+tz*3600000);return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),h:t.getUTCHours(),mi:t.getUTCMinutes()};}
const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MON_HI=['जन','फ़र','मार्च','अप्रै','मई','जून','जुल','अग','सित','अक्टू','नव','दिस'];
const MONF_EN=['January','February','March','April','May','June','July','August','September','October','November','December'],MONF_HI=['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
const monS=m=>(S.lang==='hi'?MON_HI:MON_EN)[m-1], monF=m=>(S.lang==='hi'?MONF_HI:MONF_EN)[m-1];
function fmt(jd,ref){ // time; adds date if not on reference civil day
  if(jd==null)return '—';const p=place(),c=civil(jd+1/2880,p.tz);let s;
  if(S.tf==='24')s=`${pad(c.h)}:${pad(c.mi)}`;else{const h=c.h%12||12;s=`${h}:${pad(c.mi)} ${c.h<12?'AM':'PM'}`;}
  if(ref&&(c.d!==ref.d||c.m!==ref.m))s+=`, ${c.d} ${monS(c.m)}`;return s;}
const dur=d=>{const mins=Math.round(d*1440);return `${Math.floor(mins/60)}h ${pad(mins%60)}m`;};
const tithiName=i=>i===29?L(AMAVASYA):L(TITHI[i%15]);
const tithiShort=i=>(S.lang==='hi'?(i<15?'शु ':'कृ '):(i<15?'S ':'K '))+(i===14?(S.lang==='hi'?'पूर्णिमा':'Purnima'):i===29?(S.lang==='hi'?'अमावस्या':'Amavasya'):(i%15+1));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200);}
function moonSVG(e,size){ // e = elongation degrees
  const r=45,cx=50,cy=50,rx=Math.abs(Math.cos(e*Math.PI/180))*r,wax=e<180;
  const lit=wax?`M${cx},${cy-r} A${r},${r} 0 0 1 ${cx},${cy+r} A${rx},${r} 0 0 ${e<90?0:1} ${cx},${cy-r}Z`:`M${cx},${cy-r} A${r},${r} 0 0 0 ${cx},${cy+r} A${rx},${r} 0 0 ${e>270?1:0} ${cx},${cy-r}Z`;
  return `<svg class="${size||'moon'}" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="mg${size||''}" cx="40%" cy="35%"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#f3d27a"/></radialGradient></defs><circle cx="50" cy="50" r="45" fill="#3b3560"/><path d="${lit}" fill="url(#mg${size||''})"/></svg>`;}
const illum=e=>Math.round((1-Math.cos(e*Math.PI/180))/2*100);

/* ===================== FESTIVALS & VRATS ===================== */
const qCache={};
function quickDay(y,m,d){const p=place(),k=`${p.lat},${p.lon}|${key(y,m,d)}`;if(!qCache[k]){const q=PE.quick(y,m,d,p);q.tEve=Math.floor(PE.elong(q.ss+0.125)/12);qCache[k]=q;}return qCache[k];}
function addDays(o,n){const t=new Date(Date.UTC(o.y,o.m-1,o.d+n));return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()};}
const vCache={};
function vratsForYear(y){const p=place(),ck=`${p.lat},${p.lon}|${y}`;if(vCache[ck])return vCache[ck];
  const out=[];let prev=quickDay(y-1,12,31);const start={y,m:1,d:1};
  const rules=[ // [fieldName, tithiIndex, id]
    ['tSr',10,'ekadashi'],['tSr',25,'ekadashi'],['tSr',14,'purnima'],['tSr',29,'amavasya'],['tSs',12,'pradosh'],['tSs',27,'pradosh'],
    ['tEve',18,'sankashti'],['tMid',3,'vinayaka'],['tNight',28,'shivaratri'],['tSr',7,'durgashtami']];
  for(let i=0;i<366;i++){const dt=addDays(start,i);if(dt.y!==y)break;const q=quickDay(dt.y,dt.m,dt.d);const nx=addDays(dt,1),qn=quickDay(nx.y,nx.m,nx.d);
    for(const [f,t,id] of rules){
      const was=prev[f],is=q[f],nxt=qn[f];
      const hit=is===t&&was!==t;                                    // tithi present at the reference time
      const skipped=was!==t&&is!==t&&((t-was+30)%30)<((is-was+30)%30)&&((is-was+30)%30)<15&&i>0; // kshaya — tithi passed between
      if(hit)out.push({y:dt.y,m:dt.m,d:dt.d,id,t});else if(skipped){const pd=addDays(dt,-1);out.push({y:pd.y,m:pd.m,d:pd.d,id,t});}
    }
    if(q.sunR!==qn.sunR){ // sankranti between sunrises
      const target=qn.sunR*30;const jd=PE.solve(PE.sunSid,target,q.sr+0.5,0.9856);
      const dd=jd<q.ss?dt:nx;out.push({y:dd.y,m:dd.m,d:dd.d,id:'sankranti',r:qn.sunR,jd});}
    prev=q;}
  // name ekadashis / purnima / amavasya with lunar month
  out.forEach(v=>{if(['ekadashi','purnima','amavasya'].includes(v.id)){const p2=place();const mid=PE.jdLocalMidnight(v.y,v.m,v.d,p2.tz)+0.3;const lm=PE.lunarMonth(mid);v.am=lm.amanta;v.adhik=lm.adhik;}});
  return vCache[ck]=out.filter(v=>v.y===y);}
function vratLabel(v){
  if(v.id==='ekadashi'){const pk=v.t<15?0:1;const nm=v.adhik?(pk?b('Parama','परमा'):b('Padmini','पद्मिनी')):EKA[v.am][pk];return `${L(nm)} ${tr('ekadashi')}`;}
  if(v.id==='sankranti')return `${L(RASHI[v.r][0])} ${tr('sankranti')}`;
  if(v.id==='purnima'||v.id==='amavasya')return `${L(MONTH[S.msys==='purn'&&v.id==='amavasya'?(v.am+1)%12:v.am])} ${tr(v.id)}`;
  return tr(v.id);}
const FEST_ICON={major:'🪔',vrat:'🙏',national:'🇮🇳',other:'🕊️',jayanti:'🌼',regional:'🎊'};
const OTHER=['eid','christmas','good-friday','easter','muharram','milad','guru-nanak','guru-gobind','guru-tegh','mahavir','buddha','ravidas','baisakhi'];
function festType(f){return f.type==='national'?'national':OTHER.some(x=>f.id.includes(x))?'other':(f.type==='vrat'?'vrat':'major');}
function eventsOn(y,m,d){const k=key(y,m,d);const fs=(FEST.festivals||[]).filter(f=>f.date===k).map(f=>({kind:festType(f),name:L(f),f,icon:(INFO[f.id]&&INFO[f.id].icon)||FEST_ICON[festType(f)]}));
  const vs=vratsForYear(y).filter(v=>v.y===y&&v.m===m&&v.d===d).map(v=>({kind:'vrat',name:vratLabel(v),v,icon:v.id==='sankranti'?'☀️':v.id==='purnima'?'🌕':v.id==='amavasya'?'🌑':'🙏'}));
  const KW={ekadashi:'ekadashi',purnima:'purnima',amavasya:'amavasya',sankranti:'sankranti',sankashti:'chauth',shivaratri:'shivaratri',durgashtami:'durga-ashtami',vinayaka:'ganesh-chaturthi'};
  return fs.concat(vs.filter(v=>!fs.some(f=>KW[v.v.id]&&f.f.id.includes(KW[v.v.id]))));}

    <div class="aside">${chg}${hora}</div></div>`;}
function shareText(){const {y,m,d}=S.sel;const P=PE.day(y,m,d,place());const ref={y,m,d};
  return [`🪔 ${tr('appName')} — ${T[S.lang].wd[P.wd]}, ${d} ${monF(m)} ${y} (${placeName()})`,`${tr('tithi')}: ${P.paksha==='shukla'?tr('shukla'):tr('krishna')} ${tithiName(P.tithis[0].idx)} ${tr('upto')} ${fmt(P.tithis[0].end,ref)}`,
   `${tr('nak')}: ${L(NAK[P.naks[0].idx][0])} ${tr('upto')} ${fmt(P.naks[0].end,ref)}`,`${tr('yoga')}: ${L(YOGA[P.yogas[0].idx])} · ${tr('karana')}: ${L(KARANA[P.karanas[0].name])}`,
   `${tr('sunrise')} ${fmt(P.sunrise,ref)} · ${tr('sunset')} ${fmt(P.sunset,ref)}`,`${tr('rahu')}: ${fmt(P.rahu.start,ref)} – ${fmt(P.rahu.end,ref)}`,`${tr('abhijit')}: ${fmt(P.abhijit.start,ref)} – ${fmt(P.abhijit.end,ref)}`,
   ...eventsOn(y,m,d).map(e=>`${e.icon} ${e.name}`)].join('\n');}

/* ===================== MONTH ===================== */
function monthCells(y,m,mini){const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate();
  let h=T[S.lang].wds.map((w,i)=>`<div class="wd ${i===0?'sun':''}">${mini?w.slice(0,S.lang==='hi'?3:2):w}</div>`).join('')+'<div class="day blank"></div>'.repeat(first);
  for(let d=1;d<=days;d++){const q=quickDay(y,m,d);const ev=eventsOn(y,m,d);const wd=(first+d-1)%7;const sel=S.sel.y===y&&S.sel.m===m&&S.sel.d===d;
    const showMoon=q.tSr===14||q.tSr===29||q.tSr===7||q.tSr===22;
    h+=`<button class="day ${wd===0?'sun':''} ${isToday({y,m,d})?'today':''} ${sel?'sel':''}" data-date="${key(y,m,d)}" title="${esc(ev.map(e=>e.name).join(', '))}">
      <span class="dn">${d}</span><span class="ti">${tithiShort(q.tSr)}</span>${showMoon?moonSVG(q.phase,'mo'):''}
      ${ev.slice(0,2).map(e=>`<span class="fe ${e.kind==='vrat'?'v':''}">${e.icon} ${esc(e.name)}</span>`).join('')}
      <span class="dots">${ev.slice(0,4).map(e=>`<i class="${e.kind==='vrat'?'v':e.kind==='national'?'n':''}"></i>`).join('')}</span></button>`;}
  return h;}
function lunarSpan(y,m){const p=place();const mi=d=>{const q=quickDay(y,m,d);const lm=PE.lunarMonth(q.sr);return S.msys==='purn'&&q.tSr>=15?(lm.amanta+1)%12:lm.amanta;};
  const a=mi(1),z=mi(new Date(Date.UTC(y,m,0)).getUTCDate());return a===z?L(MONTH[a]):`${L(MONTH[a])} – ${L(MONTH[z])}`;}
function sideCal(){const {y,m}=S.mon;return `<section class="card mini"><div class="mhead"><button class="btn sm" data-mstep="-1">◀</button><b>${monF(m)} ${y}<small>${lunarSpan(y,m)}</small></b><button class="btn sm" data-mstep="1">▶</button></div>
   <div class="grid">${monthCells(y,m,true)}</div><div style="display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap">${isToday(S.sel)?'':`<button class="btn sm" id="todayBtn2">${tr('today')}</button>`}<input type="date" id="dateIn2" value="${key(S.sel.y,S.sel.m,S.sel.d)}"></div></section>`;}
function upcoming(n){const t=new Date(),k=key(t.getFullYear(),t.getMonth()+1,t.getDate());return (FEST.festivals||[]).filter(f=>f.date>=k&&festType(f)!=='other').slice(0,n);}
function daysUntil(ds){const [y,m,d]=ds.split('-').map(Number);const t=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/86400000);}
const countTxt=n=>n===0?tr('isToday'):n===1?tr('tomorrow'):n>0?tr('inDays',{n}):tr('ago',{n:-n});
function sideUpcoming(){const up=upcoming(8);return `<section class="card"><h2>🎉 ${tr('nextFest')}</h2>${up.map(f=>{const [y,m,d]=f.date.split('-').map(Number);return `<div class="mu" style="cursor:pointer" data-date="${f.date}"><b>${(INFO[f.id]&&INFO[f.id].icon)||'🪔'} ${esc(L(f))}</b><span class="t sub">${d} ${monS(m)} · ${countTxt(daysUntil(f.date))}</span></div>`;}).join('')}</section>`;}
function viewMonth(){const {y,m}=S.mon;const days=new Date(Date.UTC(y,m,0)).getUTCDate();const list=[];for(let d=1;d<=days;d++)eventsOn(y,m,d).forEach(e=>list.push({d,e}));
  return `<section class="card"><div class="mhead"><button class="btn" data-mstep="-1">◀</button><b>${monF(m)} ${y}<small>${lunarSpan(y,m)} · ${placeName()}</small></b><button class="btn" data-mstep="1">▶</button></div>
   <div class="grid">${monthCells(y,m,false)}</div></section>
   <section class="card"><h2>📋 ${tr('monthFest')}</h2>${list.length?list.map(({d,e})=>`<div class="mu" style="cursor:pointer" data-date="${key(y,m,d)}"><b>${e.icon} ${esc(e.name)}</b><span class="t sub">${d} ${monS(m)} · ${T[S.lang].wds[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}</span></div>`).join(''):`<p class="sub">${tr('noFest')}</p>`}</section>`;}

/* ===================== FESTIVALS ===================== */
function festDetail(f){const I=INFO[f.id];const [y,m,d]=f.date.split('-').map(Number);let pan='';
  try{const q=quickDay(y,m,d);const lm=PE.lunarMonth(q.sr);const pk=q.tSr<15?0:1;const mi=S.msys==='purn'&&pk?(lm.amanta+1)%12:lm.amanta;pan=`${L(MONTH[mi])} ${pk?tr('krishna'):tr('shukla')} ${tithiName(q.tSr)} · ${L(NAK[q.nak][0])}`;}catch(e){}
  return `<div class="fbody">${I?`<p><b>📖 ${tr('story')}:</b> ${L(I.story)}</p><p><b>🎊 ${tr('howTo')}:</b> ${L(I.how)}</p>${I.food?`<p><b>🍲 ${tr('foods')}:</b> ${L(I.food)}</p>`:''}`:''}
    ${f.note?`<p class="sub">ℹ️ ${esc(f.note)}</p>`:''}<p class="sub">🪔 ${tr('tithiOn')} (${placeName()}): ${pan}</p><button class="btn sm" data-date="${f.date}">📅 ${tr('day')}</button></div>`;}
function viewFest(){const y=S.fyear;const k=key(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());
  const fests=(FEST.festivals||[]).filter(f=>f.date.startsWith(y+'-')).map(f=>({date:f.date,kind:festType(f),name:L(f),f}));
  const KW={ekadashi:'ekadashi',purnima:'purnima',amavasya:'amavasya',sankranti:'sankranti',sankashti:'chauth',shivaratri:'shivaratri',durgashtami:'durga-ashtami',vinayaka:'ganesh-chaturthi'};
  const vr=vratsForYear(y).map(v=>({date:key(v.y,v.m,v.d),kind:'vrat',name:vratLabel(v),v})).filter(x=>!fests.some(f=>f.date===x.date&&KW[x.v.id]&&f.f.id.includes(KW[x.v.id])));
  let all=fests.concat(vr).sort((a,b2)=>a.date<b2.date?-1:a.date>b2.date?1:0);
  const curY=y===new Date().getFullYear();const hidden=curY&&!S.past?all.filter(x=>x.date<k).length:0;if(hidden)all=all.filter(x=>x.date>=k);
  const flt=S.ffilter;if(flt!=='all')all=all.filter(x=>x.kind===flt);
  if(S.q)all=all.filter(x=>x.name.toLowerCase().includes(S.q.toLowerCase())||(x.f&&(x.f.en+' '+x.f.hi).toLowerCase().includes(S.q.toLowerCase())));
  const nxt=upcoming(1)[0];
  const years=[...new Set((FEST.festivals||[]).map(f=>+f.date.slice(0,4)))];if(!years.includes(y))years.push(y);
  let lastM=0,html='';
  for(const x of all){const [yy,m,d]=x.date.split('-').map(Number);if(m!==lastM){html+=`<div class="fm">${monF(m)} ${yy}</div>`;lastM=m;}
    const n=daysUntil(x.date);const ic=x.f?((INFO[x.f.id]&&INFO[x.f.id].icon)||FEST_ICON[x.kind]):(x.v.id==='sankranti'?'☀️':x.v.id==='purnima'?'🌕':x.v.id==='amavasya'?'🌑':'🙏');
    html+=`<details class="fe"${x.date===k?' open':''}><summary><div class="fdate"><b>${d}</b><small>${T[S.lang].wds[new Date(Date.UTC(yy,m-1,d)).getUTCDay()]}</small></div><div class="fname"><b>${ic} ${esc(x.name)}</b><em>${x.f&&S.lang==='en'?esc(x.f.hi):x.f?esc(x.f.en):''}</em></div><div class="fcount">${countTxt(n)}</div></summary>
      ${x.f?festDetail(x.f):`<div class="fbody"><p>${L(VRAT_INFO[x.v.id])}</p><button class="btn sm" data-date="${x.date}">📅 ${tr('day')}</button></div>`}</details>`;}
  return `${nxt?`<section class="card nextf"><div class="em">${(INFO[nxt.id]&&INFO[nxt.id].icon)||'🪔'}</div><div class="sub">${tr('nextFest')}</div><div class="cd">${esc(L(nxt))} · ${countTxt(daysUntil(nxt.date))}</div><div class="sub">${(()=>{const [a,bb,c]=nxt.date.split('-').map(Number);return `${T[S.lang].wd[new Date(Date.UTC(a,bb-1,c)).getUTCDay()]}, ${c} ${monF(bb)} ${a}`;})()}</div></section>`:''}
   <section class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><select id="fYear" aria-label="${tr('year')}">${years.sort().map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select>
     <input id="fSearch" type="search" placeholder="${tr('search')}" value="${esc(S.q)}" style="flex:1;min-width:160px"></div>
    <div class="chips" id="fChips">${['all','major','vrat','national','other'].map(c=>`<button class="chip ${S.ffilter===c?'on':''}" data-f="${c}">${tr(c)}</button>`).join('')}</div>
    ${hidden?`<button class="btn sm" id="pastBtn" style="margin-top:8px">⬆ ${tr('showPast',{n:hidden})}</button>`:''}<div class="flist">${html||`<p class="sub">${tr('noFest')}</p>`}</div></section>`;}

/* ===================== LEARN ===================== */
function viewLearn(){const tabs=['what','tithi','nak','yoga','muh','how'];const lab={what:'lWhat',tithi:'lTithi',nak:'lNak',yoga:'lYoga',muh:'lMuh',how:'lHow'};
  return `<nav class="seg subnav" id="learnNav">${tabs.map(t=>`<button data-v="${t}" class="${S.learn===t?'on':''}">${tr(lab[t])}</button>`).join('')}</nav><section class="card learn">${LEARN[S.learn]()}</section>`;}
const LEARN={
 what:()=>L(LEARN_TXT.what),
 tithi:()=>`${L(LEARN_TXT.tithi)}<div class="tablewrap"><table><tr><th>#</th><th>${tr('tithi')}</th><th>${S.lang==='hi'?'देवता':'Deity'}</th><th>${S.lang==='hi'?'वर्ग':'Group'}</th></tr>${TITHI.map((t,i)=>`<tr><td>${i+1}</td><td><b>${L(t)}</b>${i===14?' / '+L(AMAVASYA):''}</td><td>${L(TITHI_DEITY[i])}</td><td>${L(TITHI_GROUP[i%5])}</td></tr>`).join('')}</table></div>`,
 nak:()=>`${L(LEARN_TXT.nak)}<div class="tablewrap"><table><tr><th>#</th><th>${tr('nak')}</th><th>${S.lang==='hi'?'स्वामी':'Lord'}</th><th>${S.lang==='hi'?'देवता':'Deity'}</th><th>${S.lang==='hi'?'प्रतीक':'Symbol'}</th><th>${S.lang==='hi'?'राशि':'Sign'}</th></tr>${NAK.map((n,i)=>`<tr><td>${i+1}</td><td><b>${L(n[0])}</b></td><td>${L(PLANET[n[1]])}</td><td>${L(n[2])}</td><td>${L(n[3])}</td><td>${L(RASHI[Math.floor(i*4/9)][0])}${(i*4)%9>5?' / '+L(RASHI[Math.floor((i*4+3)/9)][0]):''}</td></tr>`).join('')}</table></div>`,
 yoga:()=>`${L(LEARN_TXT.yoga)}<div class="tablewrap"><table><tr><th>#</th><th>${tr('yoga')}</th><th>${S.lang==='hi'?'अर्थ':'Meaning'}</th><th></th></tr>${YOGA.map((t,i)=>`<tr><td>${i+1}</td><td><b>${L(t)}</b></td><td>${L(YOGA_MEAN[i])}</td><td>${YOGA_BAD.includes(i)?'<span class="tag b">✗</span>':'<span class="tag g">✓</span>'}</td></tr>`).join('')}</table></div>
   ${L(LEARN_TXT.karana)}<div class="tablewrap"><table><tr><th>#</th><th>${tr('karana')}</th><th>${S.lang==='hi'?'प्रकार':'Type'}</th></tr>${KARANA.map((k,i)=>`<tr><td>${i+1}</td><td><b>${L(k)}</b></td><td>${i<7?(S.lang==='hi'?'चर (हर महीने 8 बार)':'Movable (8 times a month)'):(S.lang==='hi'?'स्थिर (महीने में एक बार)':'Fixed (once a month)')}${i===6?' · '+tr('karanaBad'):''}</td></tr>`).join('')}</table></div>`,
 muh:()=>L(LEARN_TXT.muh)+`<div class="tablewrap"><table><tr><th>${tr('chog')}</th><th>${S.lang==='hi'?'स्वामी':'Ruler'}</th><th></th></tr>${[['amrit','moon'],['shubh','jupiter'],['labh','mercury'],['char','venus'],['udveg','sun'],['rog','mars'],['kaal','saturn']].map(([c,p])=>`<tr><td><b>${L(CHOG[c][0])}</b></td><td>${L(PLANET[p])}</td><td>${CHOG[c][1]==='g'?'<span class="tag g">✓</span>':CHOG[c][1]==='b'?'<span class="tag b">✗</span>':'<span class="tag n">~</span>'}</td></tr>`).join('')}</table></div>`,
 how:()=>L(LEARN_TXT.how)
};

/* ===================== EVENTS ===================== */
function setDate(o){S.sel={y:o.y,m:o.m,d:o.d};S.mon={y:o.y,m:o.m};}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-date]');if(!t)return;
  if(t.id==='langBtn'){S.lang=S.lang==='en'?'hi':'en';save();render();return;}
  if(t.id==='optBtn'){const o=$('#options');o.classList.toggle('open');t.setAttribute('aria-expanded',o.classList.contains('open'));return;}
  if(t.closest('#langSeg')){S.lang=t.dataset.v;save();render();$('#options').classList.add('open');return;}
  if(t.closest('#themeSeg')){S.theme=t.dataset.v;applyTheme();save();renderShell();$('#options').classList.add('open');return;}
  if(t.closest('#tfSeg')){S.tf=t.dataset.v;save();render();$('#options').classList.add('open');return;}
  if(t.closest('#msSeg')){S.msys=t.dataset.v;save();render();$('#options').classList.add('open');return;}
  if(t.closest('#mainNav')){S.view=t.dataset.v;save();render();window.scrollTo({top:0});return;}
  if(t.closest('#learnNav')){S.learn=t.dataset.v;save();render();return;}
  if(t.closest('#fChips')){S.ffilter=t.dataset.f;save();render();return;}
  if(t.dataset.step){setDate(addDays(S.sel,+t.dataset.step));render();return;}
  if(t.dataset.mstep){const mm=S.mon.m+ +t.dataset.mstep;S.mon={y:S.mon.y+(mm>12?1:mm<1?-1:0),m:(mm+11)%12+1};render();return;}
  if(t.dataset.date){const [y,m,d]=t.dataset.date.split('-').map(Number);setDate({y,m,d});S.view='day';save();render();if(innerWidth<1100)window.scrollTo({top:0,behavior:'smooth'});return;}
  if(t.dataset.fest!==undefined){S.view='fest';S.fyear=S.sel.y;S.q='';S.ffilter='all';render();const id=t.dataset.fest;if(id){const el=[...document.querySelectorAll('details.fe')].find(d=>d.querySelector(`[data-date="${id.split('|')[1]}"]`)&&d.textContent.includes(t.textContent.slice(3).trim()));if(el){el.open=true;el.scrollIntoView({block:'center'});}}else{const vt=t.textContent.slice(2).trim();const el=[...document.querySelectorAll('details.fe')].find(d=>d.textContent.includes(vt));if(el){el.open=true;el.scrollIntoView({block:'center'});}}return;}
  switch(t.id){
    case 'todayBtn':case 'todayBtn2':{const n=new Date();setDate({y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()});render();break;}
    case 'shareBtn':{const txt=shareText();(navigator.share?navigator.share({title:tr('appName'),text:txt}):navigator.clipboard.writeText(txt).then(()=>toast(tr('copied')))).catch(()=>{});break;}
    case 'printBtn':window.print();break;
    case 'pastBtn':S.past=true;render();break;
    case 'locBtn':{if(!navigator.geolocation){toast(tr('locFail'));break;}toast(tr('locating'));navigator.geolocation.getCurrentPosition(pos=>{const tz=-new Date().getTimezoneOffset()/60;
      S.loc={name:b(`${pos.coords.latitude.toFixed(2)}°, ${pos.coords.longitude.toFixed(2)}°`,`${pos.coords.latitude.toFixed(2)}°, ${pos.coords.longitude.toFixed(2)}°`),lat:pos.coords.latitude,lon:pos.coords.longitude,tz};save();render();$('#options').classList.add('open');},()=>toast(tr('locFail')),{timeout:10000});break;}
  }});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='citySel'){if(t.value!=='loc'){S.city=+t.value;S.loc=null;}save();render();$('#options').classList.add('open');}
  if((t.id==='dateIn'||t.id==='dateIn2')&&t.value){const [y,m,d]=t.value.split('-').map(Number);setDate({y,m,d});render();}
  if(t.id==='fYear'){S.fyear=+t.value;S.past=false;render();}});
document.addEventListener('input',e=>{if(e.target.id==='fSearch'){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#fSearch');i.focus();i.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if(S.view!=='day'||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowLeft'){setDate(addDays(S.sel,-1));render();}if(e.key==='ArrowRight'){setDate(addDays(S.sel,1));render();}});
// swipe on phones
let tx=null;document.addEventListener('touchstart',e=>{if(S.view==='day'&&e.target.closest('.main'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>80&&!e.target.closest('.tablewrap,.tline')){setDate(addDays(S.sel,dx<0?1:-1));render();}},{passive:true});
setInterval(()=>{if(S.view==='day'&&isToday(S.sel)&&!document.hidden){const y=scrollY;render();scrollTo(0,y);}},60000);
applyTheme();render();
window.PAPP={S,render,eventsOn,vratsForYear,setDate};
</script>
</body>
</html>
